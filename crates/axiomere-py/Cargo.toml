[package]
name = "axiomere-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings for Axiomere (PyO3). Builds the `_axiomere` extension module."
publish = false

[lib]
name = "_axiomere"
crate-type = ["cdylib"]

[dependencies]
axiomere = { path = "../axiomere" }
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = "1"
