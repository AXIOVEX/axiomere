[package]
name = "axiomere"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Axiomere — a truth ledger: an append-only, signed, hash-chained record store where records are revised by new snapshots and never deleted."
homepage = "https://axiovexsystems.com"
repository = "https://github.com/AXIOVEX/axiomere"
keywords = ["ledger", "append-only", "provenance", "immutable", "audit"]
categories = ["data-structures", "cryptography"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

[lib]
name = "axiomere"
path = "src/lib.rs"

[[bin]]
name = "axiomere"
path = "src/bin/axiomere.rs"
